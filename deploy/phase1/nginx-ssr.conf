# Internal HTTP hop ONLY. Host TLS proxy must publish HTTPS, overwrite client IP,
# and send Host/X-Forwarded-For. Container port must remain loopback-only.
server {
 listen 8081;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 6m;
 location /api/ {
  proxy_pass http://127.0.0.1:8080;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $http_x_forwarded_for;
  proxy_read_timeout 180s;
  add_header Cache-Control "no-store" always;
 }
 location /health {
  proxy_pass http://127.0.0.1:8080;
  proxy_set_header X-Forwarded-Proto https;
 }
 location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
 location / {
  proxy_pass http://127.0.0.1:8082;
  proxy_set_header Host $host;
  proxy_set_header Cookie "";
  proxy_set_header Authorization "";
  proxy_read_timeout 20s;
  add_header Cache-Control "no-store" always;
 }
}
