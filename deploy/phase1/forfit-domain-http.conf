# ForFit domain HTTP + ACME only. Keep existing sites/default unchanged.
server {
    listen 80;
    server_name 4fitchicken.io.vn www.4fitchicken.io.vn;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/forfit-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    # No checkout/login over HTTP before trusted HTTPS is configured.
    location / {
        return 503 "ForFit HTTPS setup in progress. Please use the private test endpoint for now.\n";
        add_header Content-Type text/plain;
    }
}
