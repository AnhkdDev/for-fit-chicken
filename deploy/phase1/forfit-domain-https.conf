# Dedicated ForFit domain; keep other sites and private8443 unchanged.
server {
    listen 80;
    server_name 4fitchicken.io.vn www.4fitchicken.io.vn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/forfit-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://4fitchicken.io.vn$request_uri; }
}
server {
    listen 443 ssl;
    server_name 4fitchicken.io.vn www.4fitchicken.io.vn;
    ssl_certificate /etc/letsencrypt/live/4fitchicken.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/4fitchicken.io.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    if ($host = www.4fitchicken.io.vn) { return 301 https://4fitchicken.io.vn$request_uri; }
    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
    }
}
